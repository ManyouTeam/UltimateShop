# Wszystkie komunikaty mogą być również wielowierszowe — użyj poniższego formatu!
help:
  main: |
    &#98FB98&lUltimateShop &7Autor: @PQguanfang
    &f/shop help &7- Wyświetla pomoc.
    &f/shop menu <menuName> &7- Otwiera wskazane wspólne menu.
    &f/shop menu <shopName> &7- Otwiera menu wskazanego sklepu.
    &f/shop searchgui &7- Otwiera GUI wyszukiwania przedmiotów.
    &f/shop sellhand &7- Sprzedaje cały stos trzymany w głównej ręce.
    &f/shop sellall &7- Otwiera menu sprzedaży wszystkich przedmiotów.
  main-admin: |
    &#98FB98&lUltimateShop &7Autor: @PQguanfang
    &f/shop help &7- Wyświetla pomoc.
    &f/shop menu <menuName> &7- Otwiera wskazane wspólne menu.
    &f/shop menu <shopName> &7- Otwiera menu wskazanego sklepu.
    &f/shop searchgui &7- Otwiera GUI wyszukiwania przedmiotów.
    &f/shop sellhand &7- Sprzedaje cały stos trzymany w głównej ręce.
    &f/shop quickbuy <shopName> <itemName> &7- Szybko kupuje wskazany przedmiot bez otwierania menu.
    &f/shop quicksell <shopName> <itemName> &7- Szybko sprzedaje wskazany przedmiot bez otwierania menu.
    &f/shop reload &7- Przeładowuje plugin.
    &f/shop sellall &7- Otwiera menu sprzedaży wszystkich przedmiotów.
    &f/shop setbuytimes <shopName> <itemName> <playerName> [amount] &7- Ustawia liczbę zakupów.
    &f/shop setselltimes <shopName> <itemName> <playerName> [amount] &7- Ustawia liczbę sprzedaży.
    &f/shop addbuytimes <shopName> <itemName> <playerName> <amount> &7- Dodaje liczbę zakupów.
    &f/shop addselltimes <shopName> <itemName> <playerName> <amount> &7- Dodaje liczbę sprzedaży.
    &f/shop resetrandomplaceholder <placeholderID> &7- Resetuje wartość losowego placeholdera. &c(Premium)
    &f/shop setrandomplaceholder <placeholderID> [element] &7- Ustawia wartość losowego placeholdera. &c(Premium)
    &f/shop setcustomplaceholder <placeholderID> <value> [playerName] &7- Ustawia wartość własnego placeholdera. &c(Premium)
    &f/shop getplaceholdervalue <text> &7- Przetwarza podany tekst. &c(Premium)
    &f/shop saveitem <itemID> &7- Zapisuje trzymany przedmiot.
    &f/shop generateitemformat &7- Konwertuje trzymany przedmiot do formatu ItemFormat.
    &f/shop givesellstick <itemID> <playerID> [amount] &7- Daje przedmiot-laskę sprzedaży. &c(Premium)
  main-console: |
    &#98FB98&lUltimateShop &7Autor: @PQguanfang
    &f/shop help &7- Wyświetla pomoc.
    &f/shop menu <menuName> <playerName> &7- Wymusza otwarcie wskazanego wspólnego menu dla gracza.
    &f/shop menu <shopName> <playerName> &7- Wymusza otwarcie menu wskazanego sklepu dla gracza.
    &f/shop reload &7- Przeładowuje plugin.
    &f/shop setbuytimes <shopName> <itemName> <playerName> [amount] &7- Ustawia liczbę zakupów.
    &f/shop setselltimes <shopName> <itemName> <playerName> [amount] &7- Ustawia liczbę sprzedaży.
    &f/shop addbuytimes <shopName> <itemName> <playerName> <amount> &7- Dodaje liczbę zakupów.
    &f/shop addselltimes <shopName> <itemName> <playerName> <amount> &7- Dodaje liczbę sprzedaży.
    &f/shop resetrandomplaceholder <placeholderID> &7- Resetuje wartość losowego placeholdera. &c(Premium)
    &f/shop setrandomplaceholder <placeholderID> [element] &7- Ustawia wartość losowego placeholdera. &c(Premium)
    &f/shop getplaceholdervalue <text> &7- Przetwarza podany tekst. &c(Premium)
    &f/shop givesellstick <itemID> <playerID> [amount] &7- Daje przedmiot-laskę sprzedaży. &c(Premium)

