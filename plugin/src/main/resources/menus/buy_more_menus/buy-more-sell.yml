# Inventory slots use root layout; ArcMenu and Ore use ui.layout and each button ui.placement.
dialog:
  enabled: false
  layout: multi-action
  content: ''
  button-width: 150
  columns: 2
bedrock:
  enabled: true
  content: ''
arcmenu:
  enabled: false
title: '{lang:buy-more-title}'
size: 54
layout:
- '000000000'
- 0abcdefg0
- '000000000'
- '065401230'
- 0000F0000
- A0000000C
amount-items:
  1:
    display-item:
      material: GREEN_WOOL
      name: '&a+1'
      lore:
      - '{lang:buy-more-add-1}'
    add-amount: 1
    ui:
      appearance: button
      placement:
        area: amounts
        row: 0
        column: 0
  2:
    display-item:
      material: GREEN_WOOL
      amount: 10
      name: '&a+10'
      lore:
      - '{lang:buy-more-add-10}'
    add-amount: 10
    ui:
      appearance: button
      placement:
        area: amounts
        row: 0
        column: 1
  3:
    display-item:
      material: GREEN_WOOL
      amount: 32
      name: '&a+32'
      lore:
      - '{lang:buy-more-add-32}'
    add-amount: 32
    ui:
      appearance: button
      placement:
        area: amounts
        row: 0
        column: 2
  4:
    display-item:
      material: RED_WOOL
      name: '&c-1'
      lore:
      - '{lang:buy-more-reduce-1}'
    add-amount: -1
    ui:
      appearance: button
      placement:
        area: amounts
        row: 1
        column: 0
  5:
    display-item:
      material: RED_WOOL
      amount: 10
      name: '&c-10'
      lore:
      - '{lang:buy-more-reduce-10}'
    add-amount: -10
    ui:
      appearance: button
      placement:
        area: amounts
        row: 1
        column: 1
  6:
    display-item:
      material: RED_WOOL
      amount: 32
      name: '&c-32'
      lore:
      - '{lang:buy-more-reduce-32}'
    add-amount: -32
    ui:
      appearance: button
      placement:
        area: amounts
        row: 1
        column: 2
display-items:
- a
- b
- c
- d
- e
- f
- g
confirm-items:
  F:
    display-item:
      material: PAPER
      name: '{lang:buy-more-sell-button} x{amount}'
      lore:
      - '{lang:buy-more-sell-button-lore-1}'
      - '{lang:buy-more-sell-button-lore-2}'
    click-action: sell
    ui:
      appearance: button
      placement:
        area: confirmation
        order: 0
buttons:
  0:
    display-item:
      material: BLACK_STAINED_GLASS_PANE
      name: ' '
    ui:
      placement:
        enabled: false
  A:
    display-item:
      material: ARROW
      name: '{lang:back-button}'
    actions:
      1:
        type: back
        shop: '{shop}'
    ui:
      placement:
        area: footer
        x: 0
        y: 0
        width: 108
        height: 27
      font-size: 1.0
      text-align: left
  C:
    display-item:
      material: BARRIER
      name: '{lang:close-button}'
    actions:
      1:
        type: close
    ui:
      placement:
        area: footer
        x: 504
        y: 0
        width: 108
        height: 27
      font-size: 1.0
      text-align: left
ui:
  layout:
    canvas:
      width: 648
      height: 414
    header:
      title:
        enabled: true
        text: '{title}'
        x: 18
        y: 9
        width: 570
        align: left
        font-size: 1.3
      content:
        enabled: true
        text: '{content}'
        x: 18
        y: 36
        width: 570
        align: left
        font-size: 0.8
      sidebar-title:
        enabled: true
        text: '{lang:menu.arcmenu.navigation}'
        x: 18
        y: 63
        width: 108
        align: left
        font-size: 0.9
      content-title:
        enabled: true
        text: '{lang:menu.arcmenu.products}'
        x: 144
        y: 63
        width: 486
        align: left
        font-size: 0.9
    areas:
      sidebar:
        type: stack
        x: 18
        y: 90
        width: 108
        height: 270
        item-height: 36
        gap: 9
      footer:
        type: free
        x: 18
        y: 369
        width: 612
        height: 27
      preview:
        type: grid
        x: 144
        y: 90
        width: 156
        height: 126
        columns: 1
        rows: 1
        cell-height: 126
        gap: 0
      amounts:
        type: grid
        x: 309
        y: 90
        width: 321
        height: 180
        columns: 3
        rows: 3
        cell-height: 54
        gap: 9
      confirmation:
        type: stack
        x: 144
        y: 288
        width: 486
        height: 54
        item-height: 27
        gap: 0
    pagination:
      enabled: true
      previous:
        x: 297
        y: 369
        width: 36
        height: 27
      indicator:
        x: 342
        y: 369
        width: 90
        height: 27
      next:
        x: 441
        y: 369
        width: 36
        height: 27
  products:
    placement:
      area: content
    card:
      icon-size: 32
      padding: 9
      name-size: 1.0
      price-size: 0.85
      button-height: 27
      buttons:
        inset-x: 6
        inset-bottom: 6
        gap: 3
      price-lines: 1
      lore-lines: 6
      description-lines: 2
      button-font-size: 1.0
    price:
      enabled: true
      formats:
        both: '{lang:menu.bedrock.price-extra-line.default}'
        only-buy: '{lang:menu.bedrock.price-extra-line.only-buy}'
        only-sell: '{lang:menu.bedrock.price-extra-line.only-sell}'
    actions:
      primary:
      - buy
      - sell
      extra: auto
      labels:
        buy: '{lang:menu.arcmenu.buy}'
        sell: '{lang:menu.arcmenu.sell}'
  theme:
    background: '#EF0C1223'
    sidebar: '#DE111B30'
    card: '#141E30'
    border: '#425776'
    accent: '#65E8EF'
    text: '#FFFFFF'
    button:
      background: '#354861'
      hover: '#4D789C'
      border: '#6B829F'
    buy:
      background: '#21674D'
      hover: '#2D8967'
    sell:
      background: '#285A89'
      hover: '#367AAF'
  text:
    cancel: '{lang:menu.arcmenu.cancel}'
    no-extra: '{lang:menu.arcmenu.no-extra}'
  renderers:
    ore:
      templates:
        product: {}
        button: {}
    arcmenu:
      screen-scale: 1.35
      update-interval: 20
      animation:
        enabled: true
        duration: 8
      more-menu:
        columns: 1
      tooltip:
        enabled: true
        width: 260
        font-size: 0.9
        padding: 8
display-items-ui:
  ui:
    placement:
      area: preview
    appearance: card
