# Inventory-only item deposit menu. Configure slots with size and layout.

menu-type: item-sell

title: '{lang:item-sell-title}'
size: 54

max-sell-amount: -1

layout:
  - '000000000'
  - '0IIIIIII0'
  - '0IIIIIII0'
  - '0IIIIIII0'
  - '000000000'
  - '00B0C0X00'

input-item: I

confirm-item: C

buttons:
  0:
    display-item:
      material: GRAY_STAINED_GLASS_PANE
      name: ' '
  B:
    display-item:
      material: ARROW
      name: '{lang:back-button}'
    actions:
      1:
        type: back
        menu: main
  X:
    display-item:
      material: BARRIER
      name: '{lang:close-button}'
    actions:
      1:
        type: close

confirm-button:
  display-item:
    material: EMERALD
    name: '{lang:item-sell-confirm-name}'
    lore:
      - '{lang:item-sell-confirm-price}'
      - '{lang:item-sell-confirm-original-price}'
      - '{lang:item-sell-confirm-multiplier}'
      - '{lang:item-sell-confirm-amount}'
      - '{lang:item-sell-confirm-unsellable}'
      - '{lang:item-sell-confirm-click}'
