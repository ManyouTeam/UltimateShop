ui:
  layout:
    canvas:
      width: 648
      height: 414
    header:
      title:
        enabled: true
        text: '{title}'
        x: 18
        y: 9
        width: 570
        align: left
        font-size: 1.3
      content:
        enabled: true
        text: '{content}'
        x: 18
        y: 36
        width: 570
        align: left
        font-size: 0.8
      sidebar-title:
        enabled: true
        text: '{lang:menu.arcmenu.navigation}'
        x: 18
        y: 63
        width: 108
        align: left
        font-size: 0.9
      content-title:
        enabled: true
        text: '{lang:menu.arcmenu.categories}'
        x: 144
        y: 63
        width: 486
        align: left
        font-size: 0.9
    areas:
      sidebar:
        type: stack
        x: 18
        y: 90
        width: 108
        height: 270
        item-height: 36
        gap: 9
      content:
        type: grid
        x: 144
        y: 90
        width: 486
        height: 270
        columns: 3
        rows: 2
        cell-height: 126
        gap-x: 9
        gap-y: 9
      footer:
        type: free
        x: 18
        y: 369
        width: 612
        height: 27
    pagination:
      enabled: true
      previous:
        x: 297
        y: 369
        width: 36
        height: 27
      indicator:
        x: 342
        y: 369
        width: 90
        height: 27
      next:
        x: 441
        y: 369
        width: 36
        height: 27
  products:
    placement:
      area: content
    card:
      icon-size: 32
      padding: 9
      name-size: 1.0
      price-size: 0.85
      button-height: 27
      buttons:
        inset-x: 6
        inset-bottom: 6
        gap: 3
      price-lines: 1
      lore-lines: 6
      description-lines: 2
      button-font-size: 1.0
    price:
      enabled: true
      formats:
        both: '{lang:menu.bedrock.price-extra-line.default}'
        only-buy: '{lang:menu.bedrock.price-extra-line.only-buy}'
        only-sell: '{lang:menu.bedrock.price-extra-line.only-sell}'
    actions:
      primary:
      - buy
      - sell
      extra: auto
      labels:
        buy: '{lang:menu.arcmenu.buy}'
        sell: '{lang:menu.arcmenu.sell}'
  theme:
    background: '#EF0C1223'
    sidebar: '#DE111B30'
    card: '#141E30'
    border: '#425776'
    accent: '#65E8EF'
    text: '#FFFFFF'
    button:
      background: '#354861'
      hover: '#4D789C'
      border: '#6B829F'
    buy:
      background: '#21674D'
      hover: '#2D8967'
    sell:
      background: '#285A89'
      hover: '#367AAF'
  text:
    cancel: '{lang:menu.arcmenu.cancel}'
    no-extra: '{lang:menu.arcmenu.no-extra}'
  renderers:
    ore:
      templates:
        product: {}
        button: {}
    arcmenu:
      screen-scale: 1.35
      update-interval: 20
      animation:
        enabled: true
        duration: 8
      more-menu:
        columns: 1
      tooltip:
        enabled: true
        width: 260
        font-size: 0.9
        padding: 8
