# Inventory slots use root layout; ArcMenu and Ore use ui.layout and each button ui.placement.
dialog:
  enabled: true
  layout: multi-action
  content: ''
  button-width: 150
  columns: 2
bedrock:
  enabled: true
  content: ''
arcmenu:
  enabled: false
title: '{lang:shop-title}'
size: 54
open-actions:
