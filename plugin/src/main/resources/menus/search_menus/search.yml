# Inventory slots use root layout; ArcMenu and Ore use ui.layout and each button ui.placement.
content: ''
menu-type: search
title: '{lang:menu.search-gui.title}'
size: 54
layout:
- 00H0N0C00
- '001111100'
- '000000000'
- '066666660'
- '066666660'
- 00B000X00
input-item: '1'
result-item: '6'
buttons:
  0:
    display-item:
      material: GRAY_STAINED_GLASS_PANE
      name: ' '
    ui:
      placement:
        enabled: false
  B:
    display-item:
      material: ARROW
      name: '{lang:back-button}'
    actions:
      1:
        type: back
        menu: main
    ui:
      placement:
        area: footer
        x: 0
        y: 0
        width: 108
        height: 27
      font-size: 1.0
      text-align: left
  X:
    display-item:
      material: BARRIER
      name: '{lang:close-button}'
    actions:
      1:
        type: close
    ui:
      placement:
        area: footer
        x: 504
        y: 0
        width: 108
        height: 27
      font-size: 1.0
      text-align: left
action-items:
  H:
    action-type: input-name
    display-item:
      material: HOPPER
      name: '{lang:search-gui-guide-name}'
      lore:
      - '{lang:search-gui-guide-line-1}'
      - '{lang:search-gui-guide-line-2}'
      - '{lang:search-gui-guide-line-3}'
      - '{lang:search-gui-guide-line-4}'
    ui:
      placement:
        area: sidebar
        order: 0
  C:
    action-type: clear-search
    display-item:
      material: BARRIER
      name: '{lang:search-gui-clear-name}'
      lore:
      - '{lang:search-gui-clear-line-1}'
    ui:
      placement:
        area: sidebar
        order: 10
state-items:
  N:
    empty-input:
      display-item:
        material: PAPER
        name: '{lang:search-gui-empty-name}'
        lore:
        - '{lang:search-gui-empty-line-1}'
        - '{lang:search-gui-empty-line-2}'
    has-input:
      display-item:
        material: COMPASS
        name: '{lang:search-gui-state-name}'
        lore:
        - '{lang:search-gui-state-line-1}'
        - '{lang:search-gui-state-line-2}'
        - '{lang:search-gui-state-line-3}'
    ui:
      placement:
        area: sidebar
        order: 20
no-result-item:
  slot: 31
  display-item:
    material: BARRIER
    name: '{lang:search-gui-no-result-name}'
    lore:
    - '{lang:search-gui-no-result-line-1}'
    - '{lang:search-gui-no-result-line-2}'
  ui:
    placement:
      area: content
      row: 0
      column: 0
    appearance: card
result-lore:
- ' '
- '{lang:search-gui-result-shop}'
- '{lang:search-gui-result-product}'
- '{lang:search-gui-result-click}'
ui:
  mode:
    java: inherit
    bedrock: inherit
  layout:
    canvas:
      width: 648
      height: 414
    header:
      title:
        enabled: true
        text: '{title}'
        x: 18
        y: 9
        width: 570
        align: left
        font-size: 1.3
      content:
        enabled: true
        text: '{content}'
        x: 18
        y: 36
        width: 570
        align: left
        font-size: 0.8
      sidebar-title:
        enabled: true
        text: '{lang:menu.arcmenu.navigation}'
        x: 18
        y: 63
        width: 108
        align: left
        font-size: 0.9
      content-title:
        enabled: true
        text: '{lang:menu.arcmenu.products}'
        x: 144
        y: 63
        width: 486
        align: left
        font-size: 0.9
    areas:
      sidebar:
        type: stack
        x: 18
        y: 90
        width: 108
        height: 270
        item-height: 36
        gap: 9
      content:
        type: grid
        x: 144
        y: 90
        width: 486
        height: 270
        columns: 3
        rows: 2
        cell-height: 126
        gap-x: 9
        gap-y: 9
      footer:
        type: free
        x: 18
        y: 369
        width: 612
        height: 27
    pagination:
      enabled: true
      previous:
        x: 297
        y: 369
        width: 36
        height: 27
      indicator:
        x: 342
        y: 369
        width: 90
        height: 27
      next:
        x: 441
        y: 369
        width: 36
        height: 27
  products:
    placement:
      area: content
    card:
      icon-size: 32
      padding: 9
      name-size: 1.0
      price-size: 0.85
      button-height: 27
      buttons:
        inset-x: 6
        inset-bottom: 6
        gap: 3
      price-lines: 1
      lore-lines: 6
      description-lines: 2
      button-font-size: 1.0
    price:
      enabled: true
      formats:
        both: '{lang:menu.bedrock.price-extra-line.default}'
        only-buy: '{lang:menu.bedrock.price-extra-line.only-buy}'
        only-sell: '{lang:menu.bedrock.price-extra-line.only-sell}'
    actions:
      primary:
      - buy
      - sell
      extra: auto
      labels:
        buy: '{lang:menu.arcmenu.buy}'
        sell: '{lang:menu.arcmenu.sell}'
  theme:
    background: '#EF0C1223'
    sidebar: '#DE111B30'
    card: '#141E30'
    border: '#425776'
    accent: '#65E8EF'
    text: '#FFFFFF'
    button:
      background: '#354861'
      hover: '#4D789C'
      border: '#6B829F'
    buy:
      background: '#21674D'
      hover: '#2D8967'
    sell:
      background: '#285A89'
      hover: '#367AAF'
  text:
    cancel: '{lang:menu.arcmenu.cancel}'
    no-extra: '{lang:menu.arcmenu.no-extra}'
  renderers:
    inventory: {}
    form:
      auto-add-icon:
        enabled: true
        format: https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/refs/heads/{version}/assets/minecraft/textures/{path}.png
      check-method: FLOODGATE
      not-auto-close: true
      buy-or-sell:
        title: '{lang}'
        buttons:
          amount:
            name: '{lang}'
            tip: '{lang}'
      info:
        title: '{lang}'
        buttons:
          buy: '{lang}'
          sell: '{lang}'
          buy-more: '{lang}'
          sell-all: '{lang}'
          back: '{lang}'
    dialog:
      not-auto-close: true
      auto-add-sprite:
        enabled: true
        auto-hide: true
        format: <sprite:"{namespace}:{atlas}":{path}>
      default-button: '{lang:menu.dialog.default-button}'
      details: '{lang:menu.dialog.details}'
      search:
        input: '{lang:menu.dialog.search.input}'
        buttons:
          search: '{lang:menu.dialog.search.buttons.search}'
      buy-more:
        display-item: true
        title: '{lang:menu.dialog.buy-more.title}'
        input: '{lang:menu.dialog.buy-more.input}'
        buttons:
          confirm: '{lang:menu.dialog.buy-more.buttons.confirm}'
      info:
        display-item: true
        title: '{lang:menu.dialog.info.title}'
        buttons:
          buy: '{lang:menu.dialog.info.buttons.buy}'
          sell: '{lang:menu.dialog.info.buttons.sell}'
          buy-more: '{lang:menu.dialog.info.buttons.buy-more}'
          sell-all: '{lang:menu.dialog.info.buttons.sell-all}'
          back: '{lang:menu.dialog.info.buttons.back}'
      favourite-edit:
        title: '{lang:menu.dialog.favourite-edit.title}'
        content: '{lang:menu.dialog.favourite-edit.content}'
        buttons:
          forward: '{lang:menu.dialog.favourite-edit.buttons.forward}'
          backward: '{lang:menu.dialog.favourite-edit.buttons.backward}'
          remove: '{lang:menu.dialog.favourite-edit.buttons.remove}'
          back: '{lang:menu.dialog.favourite-edit.buttons.back}'
    ore:
      show-item-icon:
        enabled: true
        auto-hide-one: true
      pack-format: 0
      templates:
        product: {}
        button: {}
    arcmenu:
      screen-scale: 1.35
      update-interval: 20
      animation:
        enabled: true
        duration: 8
      details:
        enabled: true
      more-menu:
        columns: 1
      tooltip:
        enabled: true
        width: 260
        font-size: 0.9
        padding: 8
